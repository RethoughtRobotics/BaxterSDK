---
# third_eye (ZED 2i): left colour only, no depth, no tracking, no sensors.
# Publishes /cameras/third_eye/color/image_raw (+ camera_info), remapped from zed_node/left/.
# HD720 downscaled 2x = 640x360 at 30 fps.
#
# Launched by: ros2 launch baxter_interface third_eye_zed.launch.py
#   (baxter_start and run_teleop.sh start it automatically)
/**:
  ros__parameters:
    general:
      camera_model: zed2i
      grab_resolution: HD720
      grab_frame_rate: 30
      pub_resolution: CUSTOM
      pub_downscale_factor: 2.0
      pub_frame_rate: 30.0
      sdk_verbose: 0

    video:
      auto_exposure_gain: true
      auto_whitebalance: true

    depth:
      depth_mode: NONE

    pos_tracking:
      pos_tracking_enabled: false
      publish_tf: false
      publish_map_tf: false
      publish_imu_tf: false

    mapping:
      mapping_enabled: false

    object_detection:
      od_enabled: false

    body_tracking:
      bt_enabled: false

    sensors:
      sensors_image_sync: false
      sensors_pub_rate: 0.0
      publish_imu_tf: false
