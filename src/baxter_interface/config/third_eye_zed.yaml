---
# third_eye (ZED): workspace camera matching the RealSense third-eye's output.
# Colour only, 640x480 equivalent at 30 fps (HD720 grab downscaled 2x = 640x360;
# set pub_downscale_factor to 1.0 and grab_resolution to VGA for native 672x376).
# Depth, positional tracking, mapping, and detection are off: the pipeline uses
# only /cameras/third_eye/color/image_raw (+ camera_info), same as the RealSense.
#
# Launched by: ros2 launch baxter_interface third_eye_zed.launch.py
#   (run_teleop.sh starts it automatically unless --realsense or --no-camera)
/**:
  ros__parameters:
    general:
      camera_model: zed2i
      grab_resolution: HD720
      grab_frame_rate: 30
      pub_resolution: CUSTOM
      pub_downscale_factor: 2.0
      pub_frame_rate: 30.0
      sdk_verbose: 0

    depth:
      depth_mode: NONE

    pos_tracking:
      pos_tracking_enabled: false
      publish_tf: false
      publish_map_tf: false
      publish_imu_tf: false

    mapping:
      mapping_enabled: false

    object_detection:
      od_enabled: false

    body_tracking:
      bt_enabled: false

    sensors:
      sensors_image_sync: false
      sensors_pub_rate: 0.0
