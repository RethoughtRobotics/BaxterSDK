---
# vr_axes_base.yaml for the raw_id output (run_teleop.sh --output raw_id --vr-gain 2 --vr-config <this file>):
# linear loop gain 6/s (vr_axes_base.yaml at --vr-gain 2: 3/s); rotation 2, 2, 5.8/s, as vr_axes_base.yaml at
# --vr-gain 1. Yaw at 11.6/s (5.8 x 2) drove w2 into its velocity and Ruckig acceleration limits and
# oscillated at ~1.2 Hz, which the IK's uniform scaling spread into the translation (VR bag 20261016_210332).
# With raw_id the joints follow their setpoint within 0-35 ms (vs ~200 ms in velocity mode), so the
# ringing limit noted below (~6/s, from velocity mode) no longer applies to translation. Planar circle
# tests on the robot (run_circle_test.sh, 20261016_2053/2054): K=6 halved the error of K=3 and stayed
# stable; K=10 saturated and oscillated. Do not raise --vr-gain to get there: it scales rotation too.
# VR controller -> robot mapping for `baxter_teleop --input vr --vr-config vr_axes_base.yaml`.
# Same as vr_axes.yaml except that translation is taken in the anchor frame (set by pressing A)
# and mapped once onto the robot base frame, so wrist rotation never re-aims it. Drop the
# --vr-config flag to go back to vr_axes.yaml.
linear_frame: base

# For each base axis [x forward, y robot-left, z up], the anchor axis that drives it, with sign.
# Each must use x, y, z exactly once. Starting point from circle_clockwise_20261001_184937
# (the map felt on its first stroke, snapped to axes; vr_replay prints it): confirm on the robot
# by clutching and pushing forward, left and up, then fix the signs. Press A holding the
# controller the same way each time, since the anchor frame is the reference.
# linear_axes: [-z, +x, -y]
linear_axes: [+x, +y, +z]
# Identity with the gravity-levelled anchor (libsurvive_ros2): the anchor is x = the
# controller's pointing direction at the A press (flattened), y = its left, z = up, so your
# forward/left/up at the A press is Baxter's forward/left/up: your right is Baxter's right
# however you stand, and pressing A again re-references it. (Facing Baxter, its right is your
# left in the room, so it mirrors you.) The commented-out maps were fitted to the old,
# unlevelled anchor. Confirm on the robot: press A, push forward/left/up, fix any sign here.
# Rotation, same frame: a wrist turn about your forward/left/up (in anchor axes) turns the TCP
# about the base axis it maps to. Must be a proper rotation (det +1): with a mirrored axis the
# TCP turns the opposite way about it. Confirm by twisting about each axis.
# angular_axes: [+z, -x, -y]
angular_axes: [x, +y, +z]  # was [-x, -y, +z]; base_yaw does not apply to rotation

# Per TCP axis velocity scale [x, y, z], applied before the speed caps. The servo loop gain
# is --vr-gain x scale. Baxter's TCP lags its commands by ~0.12 s (translation) and ~0.09 s
# (rotation), so keep the loop gain under ~6/s linear and ~9/s angular or the arm rings
# (circle_clockwise_20261001_184937: gain 15/s on rotation rang the wrist at 2-2.3 Hz).
# Precision mode: the gripper moves motion_scale x the hand's translation (rotation 1:1), shrinking hand
# sway (~4-5 mm rms at 0.5-2 Hz while holding still, pick-and-place bag 20261016_213531) by the same
# factor. 1.0 = 1:1. Larger moves need re-clutching.
motion_scale: 0.5
linear_scale: [3.0, 3.0, 3.0]  # 6/s at --vr-gain 2 (vr_axes_base.yaml: 1.5)
angular_scale: [1.0, 1.0, 3.0]  # 2, 2, 5.8/s at --vr-gain 2 (11.6/s yaw oscillated, 20261016_210332)

# Per TCP axis deadband [x, y, z], subtracted from the stroke delta (since the clutch
# engaged) so off-axis drift is ignored without a jump at the edge: d -> sign(d)*max(|d|-band, 0).
linear_deadband: [0.001, 0.001, 0.001]  # m
angular_deadband: [0.09, 0.09, 0.06]  # rad

# Exponential smoothing of the target pose while clutched, per message (~140 Hz):
# filtered = smoothing * filtered + (1 - smoothing) * new. 0 disables it.
smoothing: 0.5

# Drive this arm with the other hand's controller (/vive/left/* <-> /vive/right/*), e.g. if
# libsurvive_ros2's left_serial/right_serial are on the wrong hands. Explicit --vr-*-topic flags win.
# Also sets where you stand: true = facing Baxter (the axes above as written); false = on Baxter's
# side, so x and y of linear_axes and angular_axes are negated (up stays up).
swap_hands: false
